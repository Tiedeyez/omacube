# Omacube: black puzzle-cube plastic and the classic sticker colours.
mode = "dark"

# The Omacube plugin paints its cubes from the active theme. These keys give
# this theme the exact classic cube: red, orange, white, yellow, green and
# blue stickers on black plastic. Omarchy itself ignores them.
omacube_red = "#c41e3a"
omacube_orange = "#ff5800"
omacube_white = "#f4f4f4"
omacube_yellow = "#ffd500"
omacube_green = "#009e60"
omacube_blue = "#0051ba"
omacube_plastic = "#0b0b0d"
omacube_empty = "#040406"

# The usual theme palette, close to the stickers but tuned to stay readable
# as terminal and editor colours on the black background.
accent = "#ffd500"
selection = "#26303f"
muted = "#4a4f5c"

background = "#0b0b0d"
dark_background = "#070708"
darker_background = "#040406"
lighter_background = "#17181c"

foreground = "#f4f4f4"
dark_foreground = "#9aa0aa"
light_foreground = "#d6d8dc"
bright_foreground = "#ffffff"

red = "#e0304a"
yellow = "#ffd500"
orange = "#ff6a1a"
green = "#00b86b"
cyan = "#3fb6e6"
blue = "#2e6fe0"
magenta = "#c06cd8"
brown = "#8a5a2b"

bright_red = "#ff5468"
bright_yellow = "#ffe347"
bright_green = "#2fd88a"
bright_cyan = "#72cdf0"
bright_blue = "#5b8ff0"
bright_magenta = "#d796ea"
